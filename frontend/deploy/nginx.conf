server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /workspaces { proxy_pass http://gateway:8080/workspaces; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /workspaces/ { proxy_pass http://gateway:8080/workspaces; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /workspaces/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /integrations/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
}
