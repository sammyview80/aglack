map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /workspaces { proxy_pass http://gateway:8080/workspaces; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /workspaces/ { proxy_pass http://gateway:8080/workspaces; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location ~ ^/workspaces/[^/]+/(chat|integrations)/?$ { try_files $uri /index.html; }
  location /workspaces/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location /integrations/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location / { try_files $uri $uri/ /index.html; }
}
