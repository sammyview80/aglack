# Pytest configuration for backend/workspace-image/.
#
# WHY pytest.ini AND NOT pyproject.toml: this directory is not a Python
# package — it is a Dockerfile plus the patch scripts it applies and the tests
# that assert on their content. There is no distribution to build, nothing to
# install, and no dependencies to declare. Adding a pyproject.toml here would
# create a [project] table that lies (an installable package that is never
# installed) and would make `pip install -e backend/workspace-image` look like
# a legitimate step it is not. pytest.ini is the narrowest file that does
# exactly one job: tell pytest how to collect this directory. It also wins
# unambiguously in pytest's rootdir/config discovery, so a run started from
# here can never accidentally inherit a parent package's settings.
#
# TWO-TIER TEST SCHEME
# --------------------
# Tier 1 — fast, hermetic, DEFAULT. The `test_*.py` files. They read the
#   Dockerfile and the `patch_kasmvnc_*.py` scripts as text/importable modules
#   and assert on their content. Standard library only, no Docker, no network;
#   the whole suite runs in well under a second. These are what CI runs.
#
# Tier 2 — slow, needs a real Docker daemon, OPT-IN ONLY.
#   `e2e_test_kasmvnc_lastactiveat.py` shells out to real `docker build` and
#   `docker run`. It is named with an `e2e_test_` prefix specifically so it
#   does NOT match `python_files` below and is never collected by accident —
#   that naming is load-bearing, not a style choice. Keep new Docker-dependent
#   tests on that same prefix.
#
# Canonical commands:
#   cd backend/workspace-image && python3 -m pytest        # tier 1 (fast)
#   cd backend/workspace-image && python3 e2e_test_kasmvnc_lastactiveat.py
#                                                          # tier 2, by hand
[pytest]

# Collect this directory. The tests live directly beside the Dockerfile they
# describe rather than in a tests/ subdirectory, which is why an explicit
# testpaths entry is needed at all.
testpaths = .

# Default collection globs, restated explicitly. This is the line that keeps
# `e2e_test_*.py` out: it matches neither pattern.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Registered so that `-m e2e` is a valid selection and, with --strict-markers,
# a typo in a marker name is an error instead of a silently-skipped test.
# Nothing is marked `e2e` today (tier 2 is excluded by filename, which needs no
# marker); this is here so a Docker-dependent test that must live in a
# `test_*.py` file has a supported way to exclude itself:
#     @pytest.mark.e2e  ->  deselect with `-m "not e2e"`
markers =
    e2e: requires a real Docker daemon (`docker build`/`docker run`); slow. Not run by default.

addopts =
    --strict-markers
    --strict-config
    -ra

# Never write .pyc into this tree; it is copied into a Docker image.
# (Equivalent to PYTHONDONTWRITEBYTECODE for the test run.)
cache_dir = .pytest_cache
