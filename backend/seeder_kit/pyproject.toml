[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seeder-kit"
version = "0.1.0"
description = "Framework-agnostic library for declaring MCP tools/skills/agent identity as a folder tree, discovering tools from it, and running them as a stdio MCP server."
readme = "README.md"
# PolyForm Noncommercial has no OSI-approved SPDX id, so this is a
# LicenseRef- expression (same convention as rust_gateway/Cargo.toml).
# Plain string, not the older `{ text = "..." }` table form: setuptools
# >=77 (PEP 639) rejects the table form with "project.license must be
# string" — verified live via `docker build`, this is a real toolchain
# version bump, not a config that ever worked differently before.
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Deliberately ZERO required dependencies — every function that needs
# something beyond the standard library (`mcp`, `pyyaml`) imports it lazily
# inside the function body, so `pip install seeder-kit` alone is enough to
# use tree.py/discovery.py/skills.py; `mcp` is only needed to actually run
# runner.py as a server process (see [project.optional-dependencies]).
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.28,<2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hermes-seeder-runner = "seeder_kit.runner:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
