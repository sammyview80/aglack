[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seeder-kit"
version = "0.1.0"
description = "Framework-agnostic library for declaring MCP tools/skills/agent identity as a folder tree, discovering tools from it, and running them as a stdio MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Deliberately ZERO required dependencies — every function that needs
# something beyond the standard library (`mcp`, `pyyaml`) imports it lazily
# inside the function body, so `pip install seeder-kit` alone is enough to
# use tree.py/discovery.py/skills.py; `mcp` is only needed to actually run
# runner.py as a server process (see [project.optional-dependencies]).
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.28,<2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hermes-seeder-runner = "seeder_kit.runner:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
