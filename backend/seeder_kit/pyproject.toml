[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seeder-kit"
version = "0.1.0"
description = "Framework-agnostic library for declaring MCP tools/skills/agent identity as a folder tree, discovering tools from it, and running them as a stdio MCP server."
readme = "README.md"
# PolyForm Noncommercial has no OSI-approved SPDX id, so this is a
# LicenseRef- expression (same convention as rust_gateway/Cargo.toml).
# Plain string, not the older `{ text = "..." }` table form: setuptools
# >=77 (PEP 639) rejects the table form with "project.license must be
# string" — verified live via `docker build`, this is a real toolchain
# version bump, not a config that ever worked differently before.
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Deliberately ZERO required dependencies — every function that needs
# something beyond the standard library (`mcp`, `pyyaml`) imports it lazily
# inside the function body, so `pip install seeder-kit` alone is enough to
# use tree.py/discovery.py/skills.py; `mcp` is only needed to actually run
# runner.py as a server process (see [project.optional-dependencies]).
dependencies = []

[project.optional-dependencies]
# `mcp>=1.28` (not `<2`, deliberately widened past the original `<2` cap):
# a real `docker build` against `backend/workspace-image/Dockerfile`
# proved `browser-use==0.13.x` needs `mcp==2.1.1` exactly, incompatible
# with the original `<2` cap. Verified widening is safe: this package's
# full test suite (52/52) passes for real against `mcp==2.1.1` in an
# isolated venv.
mcp = [
    "mcp>=1.28",
]
# NOT installed via this extras group in `backend/workspace-image/
# Dockerfile` — see that file's own `uv pip install --exclude-newer
# ... "browser-use..."` line for the real reason (a real, reproduced
# `uv` resolver conflict specific
# to that image's base layers: `hermes-agent`'s own `exclude-newer = "14
# days"` policy, which doesn't exempt `browser-use`, forces `uv` to
# resolve an OLD `browser-use` release whose OWN `mcp` pin — `==1.26.0` —
# conflicts with `hermes-agent`'s already-installed exact `mcp==2.0.0`).
# This extras group still exists so a DIFFERENT, non-Dockerfile consumer
# of `seeder_kit` (one without `hermes-agent`'s constraints already in
# its venv) can `pip install "seeder-kit[browser]"` normally — confirmed
# that combination (this package + `browser-use`, no `hermes-agent` in
# the mix) resolves and installs cleanly via both `pip` and `uv`.
# `browser-use` itself is heavy (pulls in anthropic/openai/google-genai/
# groq/ollama as REQUIRED deps, not per-provider extras — it wants to own
# its own LLM calls, confirmed via a real `pip install` probe, not
# assumed from docs). Requires Python 3.11+ (matches this package's own
# requires-python already). LLM-credential wiring (which provider/key a
# `browser-use`-backed tool module actually uses per call) is a
# deliberately SEPARATE concern that lives in the CONTENT tree, not here:
# see `backend/seeder/tools/_browser_use_llm.py` (used by `browser_task.py`).
browser = [
    "browser-use>=0.13,<0.14",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hermes-seeder-runner = "seeder_kit.runner:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
