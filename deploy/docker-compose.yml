# Control-plane compose for this repo's gateway.
#
# OpenConnector is NOT run by this repo. It is a remote, already-running,
# third-party-hosted instance operated separately — this gateway reaches
# it over the regular internet via OPENCONNECTOR_URL/OPENCONNECTOR_ADMIN_TOKEN
# (see ../rust_gateway/.env.example). This compose file has no opinion on
# how that remote instance itself is secured or run; it only starts and
# configures the gateway that talks to it.
#
#   cp .env.example .env      # fill in real values, see comments below
#   docker compose -f deploy/docker-compose.yml up -d
services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    build:
      # Context is the repo root (`deploy/` -> `..` -> `revamp/`), NOT
      # `../rust_gateway` — rust_gateway/Dockerfile's `COPY
      # backend/integrations/providers.yaml ./providers.yaml` needs
      # `backend/` as a sibling in the build context, which a
      # rust_gateway-scoped context would not include. Confirmed live:
      # `docker compose build gateway` fails at that COPY step with the
      # narrower context.
      context: ..
      dockerfile: rust_gateway/Dockerfile
    env_file:
      # Loads every optional per-provider OAuth var (GITHUB_OAUTH_*,
      # GOOGLE_OAUTH_*, SLACK_OAUTH_*, etc. — see rust_gateway/.env.example)
      # automatically, without needing a compose edit per provider added.
      # The explicit `environment:` block below still wins for the vars it
      # names (compose environment: overrides env_file: for the same key),
      # so this is additive, not a behavior change for anything already listed.
      - .env
    environment:
      OPENCONNECTOR_URL: ${OPENCONNECTOR_URL}
      OPENCONNECTOR_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN}
      GATEWAY_TOKEN_ENCRYPTION_KEY: ${GATEWAY_TOKEN_ENCRYPTION_KEY}
      GATEWAY_ADMIN_PASSWORD_HASH: ${GATEWAY_ADMIN_PASSWORD_HASH}
      GATEWAY_HOST: ${GATEWAY_HOST}
      GATEWAY_PORT: ${GATEWAY_PORT}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      GATEWAY_COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_AUTHORIZE_URL: ${GOOGLE_AUTHORIZE_URL}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL}
      GATEWAY_BACKEND_HOST: ${GATEWAY_BACKEND_HOST}
      GATEWAY_BACKEND_PORT: ${GATEWAY_BACKEND_PORT}
      INTEGRATIONS_PROVIDERS_PATH: ${INTEGRATIONS_PROVIDERS_PATH}
      WORKSPACE_IMAGE_TAG: ${WORKSPACE_IMAGE_TAG}
      WORKSPACE_DOCKER_NETWORK: ${WORKSPACE_DOCKER_NETWORK:-}
      WORKSPACE_DEFAULT_PATH: ${WORKSPACE_DEFAULT_PATH}
      WORKSPACE_GATEWAY_URL: ${WORKSPACE_GATEWAY_URL}
      WORKSPACE_TARGET_HOST: ${WORKSPACE_TARGET_HOST:-}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      # Gateway's own port stays published to the host, unchanged from
      # today's dev workflow. Loopback-only: nginx/the frontend container
      # is the only intended public entry point.
      - "127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}"
    volumes:
      # rust_gateway's workspaces feature shells out to the `docker` CLI to
      # create/start/inspect workspace containers (see
      # rust_gateway/src/workspaces/container/docker_cli.rs, docker_launcher.rs)
      # — it needs the host's Docker socket to orchestrate sibling
      # containers, not just its own filesystem.
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  workspace-image:
    build:
      context: ..
      dockerfile: backend/workspace-image/Dockerfile
    image: ${WORKSPACE_IMAGE_TAG:-hermes-workspace:prod}
    profiles: [build]

volumes:
  gateway_data:
